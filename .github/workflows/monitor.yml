name: 뉴항구호 좌석 감시

on:
  schedule:
    # 10분마다 실행 (UTC 기준. GitHub 사정에 따라 몇 분 지연될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 좌석 확인 및 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          WATCH_DATES: ${{ vars.WATCH_DATES }}
        run: python monitor.py

      - name: 상태파일(state.json) 저장
        run: |
          git config user.name "boat-seat-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state 업데이트 [skip ci]"
          git push
