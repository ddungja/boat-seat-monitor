name: Build fishing report site

on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * *"
  push:
    branches: [main]
    paths:
      - "generate_pages.py"
      - "site_sources.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate_pages.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No site changes"
          else
            git commit -m "Update generated fishing report site"
            git push
          fi
